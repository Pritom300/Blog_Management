  <div class="container my-5">
  <div class="row g-4">
    <ng-container *ngIf="blogs$ | async as blogs">
      <div class="col-12 col-md-6 col-lg-4" *ngFor="let blog of blogs">
        <div class="blog-card h-100">
          
          <!-- Image -->
          <div class="image-wrapper">
            <img
              [src]="blog.featuredImageUrl"
              [alt]="blog.title"
              class="img-fluid"
            />
          </div>

          <!-- Content -->
          <div class="content d-flex flex-column">
            <h5 class="title">
              {{ blog.title }}
            </h5>

            <p class="description">
              {{ blog.shortDescription }}
            </p>

            <div class="mt-auto">
              <a
                [routerLink]="['/blog', blog.urlHandle]"
                class="read-more"
              >
                Read more →
              </a>
            </div>
          </div>

        </div>
      </div>
    </ng-container>
  </div>
</div>
